# One-command demo:  docker compose up --build   ->  http://localhost:3000
# Demo login: demo@apex.example / ApexDemo#2026 (fictional data, seeded on first start)
# Optional: put OPENROUTER_API_KEY=... (or GEMINI_API_KEY=...) in a .env file next to this one to enable AI account plans.

services:
  db:
    image: postgres:15-alpine
    container_name: apex-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: account_planner
    ports:
      - "5433:5432" # Maps to 5433 locally to avoid collision with any local Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d account_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex-backend
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/account_planner
      - SECRET_KEY=dev-secret-key-change-me-in-production
      - SECURE_COOKIE=false
      - SAMESITE_COOKIE=lax
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      - OPENROUTER_FALLBACK_MODELS=${OPENROUTER_FALLBACK_MODELS:-google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LOCAL_OLLAMA=false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - chroma_data:/app/chroma_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8002
    container_name: apex-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  chroma_data:
