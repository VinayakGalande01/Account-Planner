<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>
        
        <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#059669" />
        </linearGradient>

        <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>

        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
        </filter>

        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
        </marker>
    </defs>

    <rect width="100%" height="100%" fill="url(#bg)" rx="12" />
    
    <text x="50" y="60" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#ffffff">PHASE 2: Data Extraction &amp; Pre-Computation</text>
    <rect x="50" y="80" width="900" height="2" fill="#334155" />

    <!-- Info Panels -->
    <!-- WHAT -->
    <rect x="50" y="110" width="280" height="100" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="70" y="140" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#34d399">WHAT (Objective)</text>
    <text x="70" y="165" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">The system fetches hard facts</text>
    <text x="70" y="185" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">from the dataset and calculates</text>
    <text x="70" y="205" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">exact financial KPIs (Win Rate, etc).</text>

    <!-- HOW -->
    <rect x="360" y="110" width="280" height="100" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="380" y="140" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#fbbf24">HOW (Mechanism)</text>
    <text x="380" y="165" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">`data_engine.py` queries Postgres</text>
    <text x="380" y="185" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">via SQLAlchemy, caches into Pandas</text>
    <text x="380" y="205" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">(60s TTL) and aggregates rows.</text>

    <!-- WHEN -->
    <rect x="670" y="110" width="280" height="100" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="690" y="140" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#60a5fa">WHEN (Timing)</text>
    <text x="690" y="165" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">After intent is known, but</text>
    <text x="690" y="185" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">strictly BEFORE calling the</text>
    <text x="690" y="205" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">AI to prevent hallucinations.</text>

    <!-- Diagram Section -->
    <rect x="50" y="250" width="900" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-dasharray="4,4" />
    <text x="500" y="280" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">Visual Data Flow</text>

    <!-- Flow Lines -->
    <path d="M 230 420 L 320 420" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />
    <path d="M 680 420 L 770 420" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />
    <path d="M 500 520 L 500 490" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step 1: Input -->
    <g transform="translate(80, 360)" filter="url(#shadow)">
        <rect width="150" height="120" rx="8" fill="#334155" stroke="#34d399" stroke-width="2" />
        <text x="75" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Intent &amp; Target</text>
        <text x="75" y="60" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">From Phase 1</text>
        <text x="75" y="85" font-family="'Inter', sans-serif" font-size="14" fill="#34d399" font-weight="700" text-anchor="middle">Target: Google</text>
    </g>

    <!-- Local Files -->
    <g transform="translate(430, 530)" filter="url(#shadow)">
        <rect width="140" height="40" rx="4" fill="url(#dataGrad)" />
        <text x="70" y="25" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">PostgreSQL</text>
    </g>

    <!-- Step 2: Processing Module -->
    <g transform="translate(320, 330)" filter="url(#shadow)">
        <rect width="360" height="160" rx="8" fill="url(#primary)" />
        <text x="180" y="35" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Data &amp; Intelligence Engines</text>
        
        <rect x="20" y="60" width="320" height="35" rx="4" fill="#1e293b" />
        <text x="180" y="82" font-family="'Inter', sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle">1. db.query(Account).filter(user_id=...)</text>

        <rect x="20" y="105" width="320" height="35" rx="4" fill="#1e293b" />
        <text x="180" y="127" font-family="'Inter', sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle">2. Calculate sum(Pipeline_Value)</text>
    </g>

    <!-- Step 3: Output -->
    <g transform="translate(770, 360)" filter="url(#shadow)">
        <rect width="180" height="120" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="2" />
        <text x="90" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">JSON Fact Sheet</text>
        <text x="90" y="55" font-family="'Inter', sans-serif" font-size="11" fill="#fcd34d" text-anchor="middle">{"account": "Google",</text>
        <text x="90" y="70" font-family="'Inter', sans-serif" font-size="11" fill="#fcd34d" text-anchor="middle"> "opps": 5,</text>
        <text x="90" y="85" font-family="'Inter', sans-serif" font-size="11" fill="#fcd34d" text-anchor="middle"> "value": "$1.2M",</text>
        <text x="90" y="100" font-family="'Inter', sans-serif" font-size="11" fill="#fcd34d" text-anchor="middle"> "win_rate": "42%"}</text>
    </g>

</svg>
