<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>
        
        <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#334155" />
            <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>

        <linearGradient id="uiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2dd4bf" />
            <stop offset="100%" stop-color="#0f766e" />
        </linearGradient>

        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
        </filter>

        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1" />
        </marker>
        <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf" />
        </marker>
    </defs>

    <rect width="100%" height="100%" fill="url(#bg)" rx="12" />
    
    <text x="50" y="60" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#ffffff">PHASE 4: Response Structuring &amp; Streaming</text>
    <rect x="50" y="80" width="900" height="2" fill="#334155" />

    <!-- Info Panels -->
    <!-- WHAT -->
    <rect x="50" y="110" width="280" height="100" rx="8" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" />
    <text x="70" y="140" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#f8fafc">WHAT (Objective)</text>
    <text x="70" y="165" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">The raw text from AI is</text>
    <text x="70" y="185" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">packaged properly and sent</text>
    <text x="70" y="205" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">to the user in real-time.</text>

    <!-- HOW -->
    <rect x="360" y="110" width="280" height="100" rx="8" fill="#1e293b" stroke="#2dd4bf" stroke-width="2" />
    <text x="380" y="140" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#5eead4">HOW (Mechanism)</text>
    <text x="380" y="165" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">`section_mapper.py` parses</text>
    <text x="380" y="185" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">markdown into components.</text>
    <text x="380" y="205" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">FastAPI pushes via Server-Sent Events.</text>

    <!-- WHEN -->
    <rect x="670" y="110" width="280" height="100" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="690" y="140" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#60a5fa">WHEN (Timing)</text>
    <text x="690" y="165" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">Asynchronously, as the local</text>
    <text x="690" y="185" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">model generates tokens. Users</text>
    <text x="690" y="205" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">see text appear instantly.</text>

    <!-- Diagram Section -->
    <rect x="50" y="250" width="900" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-dasharray="4,4" />
    <text x="500" y="280" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">Visual Data Flow</text>

    <!-- Flow Lines -->
    <path d="M 200 420 L 320 420" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="4,4" marker-end="url(#arrow)" />
    <path d="M 680 420 L 790 420" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#arrowTeal)" />

    <!-- Step 1: Input -->
    <g transform="translate(60, 360)" filter="url(#shadow)">
        <rect width="140" height="120" rx="8" fill="#334155" stroke="#ef4444" stroke-width="2" />
        <text x="70" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Incoming Stream</text>
        <text x="70" y="60" font-family="'Inter', sans-serif" font-size="12" fill="#fca5a5" text-anchor="middle">Token Chunks</text>
        <text x="70" y="80" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">from LLM</text>
        <text x="70" y="100" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">(Phase 3)</text>
    </g>

    <!-- Step 2: Processing Module -->
    <g transform="translate(320, 330)" filter="url(#shadow)">
        <rect width="360" height="180" rx="8" fill="url(#primary)" stroke="#94a3b8" stroke-width="1" />
        <text x="180" y="35" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Formatting &amp; Gateway Core</text>
        
        <rect x="20" y="60" width="320" height="40" rx="4" fill="#0f172a" />
        <text x="180" y="85" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">section_mapper.py: JSON Component wrapping</text>

        <rect x="20" y="115" width="320" height="40" rx="4" fill="#0f172a" />
        <text x="180" y="140" font-family="'Inter', sans-serif" font-size="13" fill="#5eead4" text-anchor="middle">FastAPI main.py: `StreamingResponse` (SSE)</text>
    </g>

    <!-- Step 3: Output -->
    <g transform="translate(790, 340)" filter="url(#shadow)">
        <rect width="160" height="160" rx="8" fill="url(#uiGrad)" />
        <text x="80" y="35" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Next.js UI</text>
        
        <rect x="20" y="60" width="120" height="20" rx="2" fill="#1e293b" opacity="0.6" />
        <rect x="20" y="90" width="80" height="20" rx="2" fill="#1e293b" opacity="0.6" />
        <rect x="20" y="120" width="100" height="20" rx="2" fill="#1e293b" opacity="0.6" />

        <text x="80" y="104" font-family="'Inter', sans-serif" font-size="10" fill="#ccfbf1" text-anchor="middle">Auto-Typing...</text>
    </g>

</svg>
