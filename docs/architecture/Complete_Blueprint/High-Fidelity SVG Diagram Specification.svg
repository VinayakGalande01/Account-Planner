<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" width="100%" height="100%" style="background-color: #0b0f19; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Shadow Filter -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="client-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dmz-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c1a1a"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="service-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="state-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="db-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="gpu-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb923c"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="30" y="45" font-size="22" font-weight="bold" fill="#f8fafc">APEX Enterprise System Architecture Map</text>
  <text x="30" y="68" font-size="13" fill="#94a3b8">Physical Networks, Trust Zones &amp; Data Pathways</text>

  <!-- Boundary 1: Client Zone -->
  <rect x="25" y="100" width="165" height="540" rx="10" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="35" y="122" font-size="12" font-weight="bold" fill="#94a3b8">1. CLIENT ZONE</text>

  <g filter="url(#drop-shadow)">
    <rect x="40" y="150" width="135" height="65" rx="8" fill="url(#client-grad)" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="107" y="180" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Users / AMs</text>
    <text x="107" y="195" font-size="10" fill="#94a3b8" text-anchor="middle">Browser / API Clients</text>
  </g>
  <g filter="url(#drop-shadow)">
    <rect x="40" y="270" width="135" height="65" rx="8" fill="url(#client-grad)" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="107" y="300" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Next.js SPA</text>
    <text x="107" y="315" font-size="10" fill="#94a3b8" text-anchor="middle">Framer Motion, Recharts</text>
  </g>

  <!-- Boundary 2: Ingress DMZ -->
  <rect x="210" y="100" width="180" height="540" rx="10" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="220" y="122" font-size="12" font-weight="bold" fill="#f87171">2. INGRESS DMZ</text>

  <g filter="url(#drop-shadow)">
    <rect x="230" y="180" width="140" height="65" rx="8" fill="url(#dmz-grad)" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="300" y="210" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">AWS WAF</text>
    <text x="300" y="225" font-size="10" fill="#fca5a5" text-anchor="middle">OWASP Filtering</text>
  </g>
  <g filter="url(#drop-shadow)">
    <rect x="230" y="310" width="140" height="75" rx="8" fill="url(#dmz-grad)" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="300" y="335" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">API Ingress GW</text>
    <text x="300" y="352" font-size="10" fill="#fca5a5" text-anchor="middle">JWT Verification</text>
  </g>

  <!-- Boundary 3: Secure VPC Core -->
  <rect x="415" y="100" width="520" height="540" rx="10" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="425" y="122" font-size="12" font-weight="bold" fill="#4ade80">3. SECURE VPC (CORE APP NETWORK)</text>

  <g filter="url(#drop-shadow)">
    <rect x="435" y="150" width="180" height="65" rx="8" fill="url(#service-grad)" stroke="#059669" stroke-width="1.5"/>
    <text x="525" y="178" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Auth &amp; Session Svc</text>
    <text x="525" y="195" font-size="9" fill="#a7f3d0" text-anchor="middle">User Store Manager</text>
  </g>
  <g filter="url(#drop-shadow)">
    <rect x="435" y="250" width="180" height="65" rx="8" fill="url(#service-grad)" stroke="#059669" stroke-width="1.5"/>
    <text x="525" y="278" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">CRM Ingestion Svc</text>
    <text x="525" y="295" font-size="9" fill="#a7f3d0" text-anchor="middle">File / Cloud Sync Ingest</text>
  </g>
  <g filter="url(#drop-shadow)">
    <rect x="435" y="350" width="180" height="65" rx="8" fill="url(#service-grad)" stroke="#059669" stroke-width="1.5"/>
    <text x="525" y="378" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Deterministic Engine</text>
    <text x="525" y="395" font-size="9" fill="#a7f3d0" text-anchor="middle">Health / Analytics Calculators</text>
  </g>
  <g filter="url(#drop-shadow)">
    <rect x="435" y="450" width="180" height="65" rx="8" fill="url(#service-grad)" stroke="#059669" stroke-width="1.5"/>
    <text x="525" y="478" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Agent Pipeline Core</text>
    <text x="525" y="495" font-size="9" fill="#a7f3d0" text-anchor="middle">Reasoning &amp; Flow Orchestration</text>
  </g>

  <!-- VPC Cache & Broker -->
  <g filter="url(#drop-shadow)">
    <rect x="660" y="210" width="160" height="65" rx="8" fill="url(#state-grad)" stroke="#d97706" stroke-width="1.5"/>
    <text x="740" y="238" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Redis Cache</text>
    <text x="740" y="255" font-size="9" fill="#fde68a" text-anchor="middle">In-Memory Scores Buffer</text>
  </g>
  <g filter="url(#drop-shadow)">
    <rect x="660" y="330" width="160" height="65" rx="8" fill="url(#state-grad)" stroke="#d97706" stroke-width="1.5"/>
    <text x="740" y="358" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Kafka Event Broker</text>
    <text x="740" y="375" font-size="9" fill="#fde68a" text-anchor="middle">Ingest Event Stream</text>
  </g>

  <!-- VPC Databases -->
  <g filter="url(#drop-shadow)">
    <rect x="850" y="250" width="70" height="80" rx="5" fill="url(#db-grad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <ellipse cx="885" cy="260" rx="35" ry="10" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
    <text x="885" y="295" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Postgres</text>
    <text x="885" y="310" font-size="8" fill="#ddd6fe" text-anchor="middle">Primary DB</text>
  </g>

  <!-- Boundary 4: Inference Cluster -->
  <rect x="960" y="100" width="165" height="540" rx="10" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="970" y="122" font-size="12" font-weight="bold" fill="#c084fc">4. PRIVATE GPU ZONE</text>

  <g filter="url(#drop-shadow)">
    <rect x="975" y="250" width="135" height="65" rx="8" fill="url(#gpu-grad)" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="1042" y="280" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">vLLM Gateway</text>
    <text x="1042" y="295" font-size="10" fill="#e9d5ff" text-anchor="middle">Load Balancer Router</text>
  </g>
  <g filter="url(#drop-shadow)">
    <rect x="975" y="370" width="135" height="65" rx="8" fill="url(#gpu-grad)" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="1042" y="400" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Ollama / GPUs</text>
    <text x="1042" y="415" font-size="10" fill="#e9d5ff" text-anchor="middle">Model Nodes</text>
  </g>

  <!-- Connectors -->
  <path d="M 107 215 L 107 262" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sync)"/>
  <path d="M 175 290 Q 230 290 230 215" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sync)"/>
  <path d="M 300 245 L 300 302" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sync)"/>
  <path d="M 370 340 L 427 340" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sync)"/>
  <path d="M 615 275 L 685 275" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sync)"/>
  <path d="M 615 470 Q 950 490 970 290" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sync)"/>
  <path d="M 1042 315 L 1042 362" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sync)"/>
</svg>
