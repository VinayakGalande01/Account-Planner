<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>

        <!-- Node Gradients -->
        <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>
        
        <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#059669" />
        </linearGradient>
        
        <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>
        
        <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#6d28d9" />
        </linearGradient>

        <linearGradient id="groupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
        </linearGradient>

        <!-- Drop Shadow -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <!-- Arrowhead Marker -->
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
        </marker>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#bgGradient)" rx="12" />
    <text x="500" y="40" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">APEX: Current High Level Design (HLD)</text>
    <text x="500" y="65" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle">As-Is Local Desktop Architecture</text>

    <!-- ZONES -->
    <!-- Client Zone -->
    <rect x="50" y="120" width="220" height="480" rx="16" fill="url(#groupGrad)" stroke="#475569" stroke-dasharray="6,4" />
    <text x="160" y="150" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle">Client Tier</text>

    <!-- Application Zone -->
    <rect x="310" y="120" width="380" height="480" rx="16" fill="url(#groupGrad)" stroke="#475569" stroke-dasharray="6,4" />
    <text x="500" y="150" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle">Application Tier (Localhost)</text>

    <!-- Resource Zone -->
    <rect x="730" y="120" width="220" height="480" rx="16" fill="url(#groupGrad)" stroke="#475569" stroke-dasharray="6,4" />
    <text x="840" y="150" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle">Data &amp; AI Tier</text>

    <!-- LINES / CONNECTIONS (Drawn before nodes so they are behind) -->
    
    <!-- User to Next.js -->
    <path d="M 160 270 L 160 330" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
    
    <!-- Next.js to FastAPI -->
    <path d="M 250 370 L 370 370" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
    <text x="310" y="360" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">HTTP/SSE</text>

    <!-- FastAPI to PostgreSQL -->
    <path d="M 500 420 L 500 490 L 760 490 L 760 490" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
    <text x="630" y="480" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">psycopg2</text>
    
    <!-- FastAPI to Local Files -->
    <path d="M 500 320 L 500 240 L 760 240" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
    <text x="630" y="230" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">pandas.read_excel</text>

    <!-- FastAPI to Ollama -->
    <path d="M 630 370 L 760 370" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" stroke-dasharray="4,2" />
    <text x="695" y="360" font-family="'Inter', sans-serif" font-size="12" fill="#10b981" text-anchor="middle">REST /api/generate</text>

    <!-- Next.js Node -->
    <g transform="translate(70, 330)" filter="url(#shadow)">
        <rect width="180" height="80" rx="8" fill="url(#clientGrad)" />
        <text x="90" y="35" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Next.js Web UI</text>
        <text x="90" y="55" font-family="'Inter', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">React (Port 3000)</text>
    </g>

    <!-- User Browser Node -->
    <g transform="translate(70, 190)" filter="url(#shadow)">
        <rect width="180" height="80" rx="8" fill="#334155" stroke="#475569" stroke-width="2" />
        <text x="90" y="35" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">User Browser</text>
        <text x="90" y="55" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Chrome / Safari</text>
    </g>

    <!-- FastAPI Node -->
    <g transform="translate(370, 320)" filter="url(#shadow)">
        <rect width="260" height="100" rx="8" fill="url(#serverGrad)" />
        <text x="130" y="35" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">FastAPI Backend</text>
        <text x="130" y="55" font-family="'Inter', sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Python Agent Engine</text>
        <text x="130" y="75" font-family="'Inter', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">(Port 8002)</text>
    </g>

    <!-- Local Files Node -->
    <g transform="translate(760, 200)" filter="url(#shadow)">
        <rect width="160" height="80" rx="8" fill="url(#dataGrad)" />
        <text x="80" y="35" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Local Filesystem</text>
        <text x="80" y="55" font-family="'Inter', sans-serif" font-size="12" fill="#fef3c7" text-anchor="middle">CRM .xlsx Data</text>
    </g>

    <!-- PostgreSQL Node -->
    <g transform="translate(760, 450)" filter="url(#shadow)">
        <rect width="160" height="80" rx="8" fill="url(#dataGrad)" />
        <text x="80" y="35" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">PostgreSQL DB</text>
        <text x="80" y="55" font-family="'Inter', sans-serif" font-size="12" fill="#fef3c7" text-anchor="middle">User &amp; Sessions (Port 5432)</text>
    </g>

    <!-- Ollama Node -->
    <g transform="translate(760, 330)" filter="url(#shadow)">
        <rect width="160" height="80" rx="8" fill="url(#aiGrad)" />
        <text x="80" y="35" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Local Ollama</text>
        <text x="80" y="55" font-family="'Inter', sans-serif" font-size="12" fill="#ede9fe" text-anchor="middle">llama3.2 / phi3:mini</text>
    </g>

    <!-- Legend -->
    <g transform="translate(50, 630)">
        <rect width="900" height="40" rx="6" fill="#1e293b" stroke="#334155" />
        <circle cx="20" cy="20" r="6" fill="#3b82f6" />
        <text x="35" y="24" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">Frontend</text>
        
        <circle cx="120" cy="20" r="6" fill="#10b981" />
        <text x="135" y="24" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">Backend Logic</text>

        <circle cx="250" cy="20" r="6" fill="#f59e0b" />
        <text x="265" y="24" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">Data Storage</text>

        <circle cx="380" cy="20" r="6" fill="#8b5cf6" />
        <text x="395" y="24" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">AI Compute</text>
    </g>

</svg>
