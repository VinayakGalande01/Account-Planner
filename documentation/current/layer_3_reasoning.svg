<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>
        
        <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#6d28d9" />
        </linearGradient>

        <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ef4444" />
            <stop offset="100%" stop-color="#b91c1c" />
        </linearGradient>

        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
        </filter>

        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
        </marker>
    </defs>

    <rect width="100%" height="100%" fill="url(#bg)" rx="12" />
    
    <text x="50" y="60" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#ffffff">PHASE 3: Prompt Construction &amp; LLM Reasoning</text>
    <rect x="50" y="80" width="900" height="2" fill="#334155" />

    <!-- Info Panels -->
    <!-- WHAT -->
    <rect x="50" y="110" width="280" height="100" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <text x="70" y="140" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#a78bfa">WHAT (Objective)</text>
    <text x="70" y="165" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">The system grounds the AI.</text>
    <text x="70" y="185" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">Combines user request with JSON</text>
    <text x="70" y="205" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">facts to ensure a truthful answer.</text>

    <!-- HOW -->
    <rect x="360" y="110" width="280" height="100" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
    <text x="380" y="140" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#fca5a5">HOW (Mechanism)</text>
    <text x="380" y="165" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">`reasoning_engine.py` builds</text>
    <text x="380" y="185" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">the system prompt and calls</text>
    <text x="380" y="205" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">the local `Ollama` process via HTTP.</text>

    <!-- WHEN -->
    <rect x="670" y="110" width="280" height="100" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="690" y="140" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#60a5fa">WHEN (Timing)</text>
    <text x="690" y="165" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">Immediately after Phase 2</text>
    <text x="690" y="185" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">safely returns the accurate</text>
    <text x="690" y="205" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">context dictionary.</text>

    <!-- Diagram Section -->
    <rect x="50" y="250" width="900" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-dasharray="4,4" />
    <text x="500" y="280" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">Visual Data Flow</text>

    <!-- Flow Lines -->
    <path d="M 190 420 L 320 420" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />
    <path d="M 680 420 L 790 420" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowRed)" />

    <!-- Step 1: Input -->
    <g transform="translate(60, 340)" filter="url(#shadow)">
        <rect width="130" height="160" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="2" />
        <text x="65" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Input Data</text>
        <text x="65" y="60" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">1. User Ask</text>
        <text x="65" y="80" font-family="'Inter', sans-serif" font-size="20" fill="#cbd5e1" text-anchor="middle">+</text>
        <text x="65" y="110" font-family="'Inter', sans-serif" font-size="12" fill="#fcd34d" text-anchor="middle">2. JSON Context</text>
        <text x="65" y="130" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">(From Phase 2)</text>
    </g>

    <!-- Step 2: Processing Module -->
    <g transform="translate(320, 310)" filter="url(#shadow)">
        <rect width="360" height="220" rx="8" fill="url(#primary)" />
        <text x="180" y="35" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Reasoning Engine Core</text>
        
        <rect x="20" y="60" width="320" height="60" rx="4" fill="#1e293b" />
        <text x="180" y="80" font-family="'Inter', sans-serif" font-size="12" fill="#c4b5fd" text-anchor="middle">Prompt Template Injection</text>
        <text x="180" y="100" font-family="'Inter', sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle">"Use ONLY this data to answer the user..."</text>

        <rect x="20" y="140" width="320" height="60" rx="4" fill="url(#aiGrad)" />
        <text x="180" y="160" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Local Ollama API Call</text>
        <text x="180" y="180" font-family="'Inter', sans-serif" font-size="11" fill="#fecaca" text-anchor="middle">POST /api/generate (Model: llama3.2)</text>
    </g>

    <!-- Step 3: Output -->
    <g transform="translate(790, 360)" filter="url(#shadow)">
        <rect width="160" height="120" rx="8" fill="#334155" stroke="#ef4444" stroke-width="2" />
        <text x="80" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Raw LLM Stream</text>
        <text x="80" y="60" font-family="'Inter', sans-serif" font-size="12" fill="#fca5a5" text-anchor="middle">Tokens:</text>
        <text x="80" y="80" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">"Based on the</text>
        <text x="80" y="100" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">data, Google..."</text>
    </g>

</svg>
